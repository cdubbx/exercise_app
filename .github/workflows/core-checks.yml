name: Core app checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercise-backend/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: exercise-backend/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test backend1 --noinput
      - run: python manage.py makemigrations --check --dry-run
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercisefrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: exercisefrontend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run typecheck
      - run: npm run lint:core
