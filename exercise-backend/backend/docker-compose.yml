services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # On first start, initialize the persistent dev volume from the checked-in
    # SQLite development database (which includes the local test account).
    # Later starts keep using the volume so developer changes are preserved.
    command: sh -c "if [ ! -s /data/db.sqlite3 ]; then cp /app/db.sqlite3 /data/db.sqlite3; fi && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_sqlite_data:/data
      - backend_media_data:/app/media
    environment:
      DATABASE_URL: "sqlite:////data/db.sqlite3"
      REDIS_URL: "redis://redis:6379/0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-exercise@localhost}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  backend_media_data:
  backend_sqlite_data:
