services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # A new volume gets the local test account and full public exercise catalog.
    # Existing volumes are migrated in place and retain developer changes.
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -s /data/db.sqlite3 ]; then
          cp /app/db.sqlite3 /data/db.sqlite3
          python manage.py migrate
          python manage.py loaddata fixed_exercises.json
        else
          python manage.py migrate
        fi
        exec python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_sqlite_data:/data
      - backend_media_data:/app/media
    environment:
      DATABASE_URL: "sqlite:////data/db.sqlite3"
      REDIS_URL: "redis://redis:6379/0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-exercise@localhost}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  backend_media_data:
  backend_sqlite_data:
